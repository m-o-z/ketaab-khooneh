name: Build and Deploy Application

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# ======================================================================================
# JOBS
# ======================================================================================
jobs:
  # ======================================================================================
  # FRONTEND STAGE 1: Install Next.js Dependencies
  # - Builds an image containing OS dependencies (for sharp) and all node_modules.
  # - This image is cached and only rebuilt if package files or OS dependencies change.
  # ======================================================================================
  install-frontend-dependencies:
    name: 📦 Install Frontend Dependencies
    runs-on: ubuntu-latest
    outputs:
      package_image: ${{ steps.image_meta.outputs.image_name }}
    steps:
      - name: ⬇️ Check out repository
        uses: actions/checkout@v4

      - name: 🔑 Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GT_TOKEN }}

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏷️ Generate Frontend Package Image Tag
        id: image_meta
        run: |
          TAG="frontend-deps-$(cat package.json pnpm-lock.yaml | sha1sum | cut -d' ' -f1)"
          IMAGE_NAME="ghcr.io/${{ github.repository }}:${TAG}"
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "Generated package image name: ${IMAGE_NAME}"

      - name: 📦 Build and push frontend package image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker-build/Dockerfile.frontend-packages
          push: true
          tags: ${{ steps.image_meta.outputs.image_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ======================================================================================
  # FRONTEND STAGE 2: Build Next.js Application
  # - Uses the dependency image from the previous stage for a much faster build.
  # - Creates the final, runnable Next.js application image.
  # ======================================================================================
  build-frontend:
    name: 🏗️ Build Frontend
    runs-on: ubuntu-latest
    needs: install-frontend-dependencies
    environment:
      name: production
    outputs:
      image_name: ${{ steps.image_meta.outputs.image_name }}
    steps:
      - name: ⬇️ Check out repository
        uses: actions/checkout@v4

      - name: 🔑 Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GT_TOKEN }}

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏷️ Generate Frontend Image Tag
        id: image_meta
        run: |
          TAG="frontend-${{ github.ref_name }}-${{ github.run_id }}"
          IMAGE_NAME="ghcr.io/${{ github.repository }}:${TAG}"
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: 🏗️ Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker-build/Dockerfile.frontend
          push: true
          tags: ${{ steps.image_meta.outputs.image_name }}
          build-args: |
            PACKAGE_IMAGE=${{ needs.install-frontend-dependencies.outputs.package_image }}
            # Pass all build-time and run-time args to the Docker build
            NEXT_PUBLIC_POCKETBASE_URL=${{ vars.NEXT_PUBLIC_POCKETBASE_URL }}
            NEXT_PUBLIC_DAYS_TO_REFRESH=${{ vars.NEXT_PUBLIC_DAYS_TO_REFRESH }}
            REDIS_HOST=${{ vars.REDIS_HOST }}
            REDIS_PORT=${{ vars.REDIS_PORT }}
            APP_ENV=${{ vars.APP_ENV }}
            POCKETBASE_ADMIN_USERNAME=${{ secrets.POCKETBASE_ADMIN_USERNAME }}
            POCKETBASE_ADMIN_PASSWORD=${{ secrets.POCKETBASE_ADMIN_PASSWORD }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ======================================================================================
  # BACKEND STAGE: Build Go (PocketBase) Application
  # - Builds the Go binary in a single, efficient multi-stage Docker build.
  # - Runs in parallel with the frontend dependency installation.
  # ======================================================================================
  build-backend:
    name: 🏗️ Build Backend
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.image_meta.outputs.image_name }}
    steps:
      - name: ⬇️ Check out repository
        uses: actions/checkout@v4

      - name: 🔑 Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GT_TOKEN }}

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏷️ Generate Backend Image Tag
        id: image_meta
        run: |
          TAG="backend-${{ github.ref_name }}-${{ github.run_id }}"
          IMAGE_NAME="ghcr.io/${{ github.repository }}:${TAG}"
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: 🏗️ Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./docker-build/Dockerfile.backend
          push: true
          tags: ${{ steps.image_meta.outputs.image_name }}
          build-args: |
            APP_FRONTEND_URL=${{ vars.APP_FRONTEND_URL }}
            VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ======================================================================================
  # DEPLOY STAGE: Deploy to Kubernetes
  # - This stage runs after BOTH frontend and backend builds are successful.
  # ======================================================================================
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    if: github.ref == 'refs/heads/development'
    env:
      NAMESPACE: ghafaseh-staging
      FRONTEND_DEPLOYMENT: frontend-deployment
      BACKEND_DEPLOYMENT: backend-deployment
    environment:
      name: production
    steps:
      - name: 🛠️ Configure kubectl and Deploy
        run: |
          echo "${{ secrets.K8S_STAGING_KUBECONFIG }}" > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml

          echo "Deploying frontend image: ${{ needs.build-frontend.outputs.image_name }}"
          kubectl set image deployment/$FRONTEND_DEPLOYMENT "$FRONTEND_DEPLOYMENT=${{ needs.build-frontend.outputs.image_name }}" -n $NAMESPACE --record=true

          echo "Deploying backend image: ${{ needs.build-backend.outputs.image_name }}"
          kubectl set image deployment/$BACKEND_DEPLOYMENT "$BACKEND_DEPLOYMENT=${{ needs.build-backend.outputs.image_name }}" -n $NAMESPACE --record=true

      - name: ⌚ Wait for rollout to complete
        run: |
          export KUBECONFIG=kubeconfig.yaml
          kubectl rollout status deployment/$FRONTEND_DEPLOYMENT -n $NAMESPACE --timeout=5m
          kubectl rollout status deployment/$BACKEND_DEPLOYMENT -n $NAMESPACE --timeout=5m

  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    if: github.ref == 'refs/heads/main'
    env:
      NAMESPACE: ghafaseh
      FRONTEND_DEPLOYMENT: frontend-deployment
      BACKEND_DEPLOYMENT: backend-deployment
    environment:
      name: production # This can be configured to require manual approval
    steps:
      - name: 🛠️ Configure kubectl and Deploy
        run: |
          echo "${{ secrets.K8S_PROD_KUBECONFIG }}" > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml

          echo "Deploying frontend image: ${{ needs.build-frontend.outputs.image_name }}"
          kubectl set image deployment/$FRONTEND_DEPLOYMENT "$FRONTEND_DEPLOYMENT=${{ needs.build-frontend.outputs.image_name }}" -n $NAMESPACE --record=true

          echo "Deploying backend image: ${{ needs.build-backend.outputs.image_name }}"
          kubectl set image deployment/$BACKEND_DEPLOYMENT "$BACKEND_DEPLOYMENT=${{ needs.build-backend.outputs.image_name }}" -n $NAMESPACE --record=true

      - name: ⌚ Wait for rollout to complete
        run: |
          export KUBECONFIG=kubeconfig.yaml
          kubectl rollout status deployment/$FRONTEND_DEPLOYMENT -n $NAMESPACE --timeout=5m
          kubectl rollout status deployment/$BACKEND_DEPLOYMENT -n $NAMESPACE --timeout=5m
